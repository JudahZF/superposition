name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Load SSH key for Quanta git dependencies
        # quanta-audio-io and tunnel are git dependencies on Quanta's SSH remote. Every platform
        # needs them in the lockfile, so every job fetches them.
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QUANTA_GIT_SSH_KEY }}

      - name: Trust the Quanta git host
        run: ssh-keyscan origin.cursor.com >> ~/.ssh/known_hosts

      - name: Install Rust
        # Pinned to an existing action commit; the requested compiler remains an explicit input.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: aarch64-apple-darwin

      - name: Confirm macOS runner
        run: test "$(uname -s)" = Darwin

      - name: Install dependency policy tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cargo-nextest@0.9.136,cargo-deny@0.20.2,cargo-audit@0.22.1,cargo-llvm-cov@0.8.7

      - name: Verify workspace bootstrap
        run: |
          cargo metadata --no-deps --format-version 1

      - name: Run workspace doctor
        run: cargo xtask doctor

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Apple Silicon target
        # native-sdk is deliberately excluded: it requires a local VST3 SDK (VST3_SDK_DIR).
        run: cargo check --workspace --all-targets --target aarch64-apple-darwin

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Run static tests with nextest
        run: cargo nextest run --workspace

      - name: Measure static test coverage
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --workspace --lcov --output-path target/llvm-cov/lcov.info

      # The compatibility corpus, loopback, MIDI, and soak gates need plug-in fixtures and
      # controlled Apple Silicon hardware, so hosted CI does not run them.
      - name: Smoke app bundle
        run: cargo xtask bundle --profile local-dev

      - name: Enforce dependency policy
        run: cargo deny check

      - name: Audit dependencies
        run: cargo audit

  linux:
    name: Rust quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Load SSH key for Quanta git dependencies
        # quanta-audio-io and tunnel are git dependencies on Quanta's SSH remote. Every platform
        # needs them in the lockfile, so every job fetches them.
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.QUANTA_GIT_SSH_KEY }}

      - name: Trust the Quanta git host
        run: ssh-keyscan origin.cursor.com >> ~/.ssh/known_hosts

      - name: Install Nix
        # The dev shell pins Rust, JACK, Xvfb, mingw, and the Wine build Windows plug-ins use.
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Check the NixOS module
        run: nix build .#checks.x86_64-linux.nixos-module

      - name: Run Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Check the Windows worker target
        run: nix develop -c cargo check -p sp-shared-memory-os --target x86_64-pc-windows-gnu

      - name: Type-check the macOS code
        # Rust only: zig supplies the C headers, the Objective-C shims are skipped, nothing links.
        run: nix develop -c env SUPERPOSITION_SKIP_NATIVE_SHIMS=1 cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Run tests
        # Includes the Xvfb window-streamer test and the remote loopback test.
        run: nix develop -c cargo test --workspace

      - name: Run the JACK endpoint test on a private dummy server
        run: nix develop -c cargo test -p sp-audio-io-linux --test jack -- --include-ignored

      - name: Check the Wine boundary
        run: nix develop -c cargo xtask wine-check
