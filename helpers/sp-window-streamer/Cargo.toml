[package]
name = "sp-window-streamer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Streams every top-level window of a private X server as damage tiles"

[dependencies]
rustix = { version = "1", features = ["fs", "mm", "process"] }
signal-hook = "0.3"
sp-window-stream = { path = "../../crates/sp-window-stream" }
x11rb = { version = "0.13", features = ["composite", "damage", "shm", "xfixes", "xtest"] }

[lints.rust]
# Only shm.rs maps the MIT-SHM segment the X server writes captures into.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
