[package]
name = "sp-plugin-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sdk"]
# High-level SDK support is retained for compatibility-only worker operation.
sdk = ["sp-vst3/sdk", "sp-vst3/editor-window"]
# The production preference: exact-class native SDK hosting via the C++ shim.
native-sdk = ["sdk", "sp-vst3/native-sdk"]
# Select the old vst3-host backend explicitly when native SDK hosting is unavailable.
high-level-sdk = ["sdk"]

[dependencies]
rtrb.workspace = true
sp-protocol = { path = "../../crates/sp-protocol" }
sp-shared-memory = { path = "../../crates/sp-shared-memory" }
sp-shared-memory-os = { path = "../../crates/sp-shared-memory-os" }
sp-vst3 = { path = "../../crates/sp-vst3" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
sp-supervisor = { path = "../../crates/sp-supervisor" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
png = "0.18.1"
xcb = "1.7"

[lints.rust]
# Only control_stdio.rs takes the standard streams over as the control channel.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
