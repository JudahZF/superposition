# Compatibility corpus schema.
#
# Every declared case names a fixture beneath `fixture_root` and is structurally
# parsed before it is executed. A missing or failed mandatory case is a failed
# qualification; placeholders and expected failures are not accepted.
schema_version = 2

[corpus]
# Stable corpus identifier for reports and CI output.
name = "superposition-compatibility"
# Directory, relative to this file, containing fixture bundles.
fixture_root = "fixtures"

[[case]]
# Licensed installed fixture; keep the bundle out of source control unless it is redistributable.
id = "mandatory-installed-vst3"
fixture = "mandatory-installed-vst3.vst3"
expected = "pass"
mandatory = true
