[workspace]
resolver = "3"
members = [
    "apps/superposition",
    "helpers/sp-plugin-worker",
    "helpers/sp-plugin-scanner",
    "crates/sp-model",
    "crates/sp-protocol",
    "crates/sp-shared-memory",
    "crates/sp-shared-memory-macos",
    "crates/sp-engine",
    "crates/sp-audio-io",
    "crates/sp-audio-io-macos",
    "crates/sp-vst3",
    "crates/sp-supervisor",
    "crates/sp-session",
    "crates/sp-midi",
    "crates/sp-ui",
    "crates/sp-test-support",
    "tools/xtask",
]
default-members = ["apps/superposition"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Judah Fuller"]
repository = "https://github.com/quanta-sound/superposition"

[workspace.dependencies]
rtrb = "0.3.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
