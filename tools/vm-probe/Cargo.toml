[package]
name = "vm-probe"
description = "Phase V0 probe: the round trip from a Linux host to a worker in the Windows VM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sp-protocol = { path = "../../crates/sp-protocol" }
sp-shared-memory-os = { path = "../../crates/sp-shared-memory-os" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["thread", "time"] }
sp-ivshmem = { path = "../../crates/sp-ivshmem" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json.workspace = true
sp-ivshmem = { path = "../../crates/sp-ivshmem" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints.rust]
# Only the Windows scheduling calls in `guest.rs` use unsafe code.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
