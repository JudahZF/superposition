[advisories]
version = 2
yanked = "deny"
ignore = [
    # Linux-only xcb/Wayland edges; Superposition ships aarch64 macOS only.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is present only through Linux-specific xcb/Wayland dependencies" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml is present only through Linux-specific xcb/Wayland dependencies" },
    { id = "RUSTSEC-2024-0436", reason = "paste is present only through non-macOS target dependencies" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is an unmaintained egui dependency with no reported vulnerability or available safe upgrade" },
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit redundant version requirements.
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
