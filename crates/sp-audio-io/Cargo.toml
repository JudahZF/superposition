[package]
name = "sp-audio-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rtrb.workspace = true
sp-engine = { path = "../sp-engine" }
sp-midi = { path = "../sp-midi" }
sp-model = { path = "../sp-model" }
sp-shared-memory = { path = "../sp-shared-memory" }
sp-shared-memory-os = { path = "../sp-shared-memory-os" }

[lints.rust]
# Calls the shared-memory crate's documented unsafe bank lifecycle; no FFI.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
