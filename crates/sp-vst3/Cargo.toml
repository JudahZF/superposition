[package]
name = "sp-vst3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Isolated high-level VST3 hosting via vst3-host. Enabled only by helper binaries.
sdk = ["dep:vst3-host"]
# Official SDK backend. This is deliberately opt-in: build.rs requires VST3_SDK_DIR
# only when this feature is enabled, keeping SDK-free and high-level helper builds portable.
native-sdk = ["sdk"]
# Worker-only native parent window for plug-in editors, their preview pictures, and (macOS) their
# streamed pictures and injected input: AppKit on
# macOS, X11 on Linux, Win32 in the Windows worker under Wine.
editor-window = [
    "dep:png",
    "dep:windows-sys",
    "dep:xcb",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-screen-capture-kit",
    "dep:block2",
]

[dependencies]
sp-model = { path = "../sp-model" }
vst3-host = { version = "0.9.0", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, features = ["NSApplication", "NSBitmapImageRep", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", optional = true, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", optional = true, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGEvent", "CGEventTypes", "CGImage", "CGWindow"] }
objc2-foundation = { version = "0.3.2", optional = true, features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSRunLoop", "NSString"] }
# The streamed editor's picture from the window server: the worker's own window, with no
# permission (macOS 14.4: the current process's shareable content).
objc2-screen-capture-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCScreenshotManager", "SCStream"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
png = { version = "0.18.1", optional = true }
xcb = { version = "1.7", optional = true }

[target.'cfg(windows)'.dependencies]
png = { version = "0.18.1", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1.2.47"

# Self-drawn OpenGL and Metal views for the window-server capture test.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSOpenGL", "NSOpenGLView"] }
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"

# Runs on the main thread, as AppKit needs, so it has its own main; it runs only with `--ignored`.
[[test]]
name = "editor_capture_macos"
harness = false
required-features = ["editor-window"]

[lints.rust]
# The native-sdk feature's sole FFI boundary is intentionally contained in native.rs.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
