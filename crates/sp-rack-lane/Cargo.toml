[package]
name = "sp-rack-lane"
description = "One rack lane: a worker's bank pair, gate, live ticket, dry delay and fades"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# In-process worker access for tests; never enable it in a product build.
test-access = []

[dependencies]
sp-shared-memory = { path = "../sp-shared-memory" }
sp-shared-memory-os = { path = "../sp-shared-memory-os" }

[lints.rust]
# Two bank-pair lifecycle calls forward the shared-memory crate's documented unsafe contract.
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
